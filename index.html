<style>
:root{--bg:#F7EEF1;--surface:#FFF;--ink:#2B1830;--muted:#7A6480;--line:#E6D6DD;--amber:#B87A26;--amber-soft:#F4E3C8;--plum:#4A2A52;--good:#2F7A4F;--good-soft:#DDF0E4;--bad:#B3322B;--bad-soft:#F8DEDB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1120;--surface:#251A2C;--ink:#F4EAF0;--muted:#B8A4BE;--line:#3A2C42;--amber:#E0A551;--amber-soft:#3A2A18;--plum:#C9A6D3;--good:#6FCB94;--good-soft:#1D3325;--bad:#F08A80;--bad-soft:#3D1F1D}}
:root[data-theme="dark"]{--bg:#1A1120;--surface:#251A2C;--ink:#F4EAF0;--muted:#B8A4BE;--line:#3A2C42;--amber:#E0A551;--amber-soft:#3A2A18;--plum:#C9A6D3;--good:#6FCB94;--good-soft:#1D3325;--bad:#F08A80;--bad-soft:#3D1F1D}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:1rem 1rem 4rem}
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:2.2rem;margin:.3rem 0;color:var(--plum);line-height:1}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:1.6rem;margin:1.4rem 0 .6rem;color:var(--plum)}
.sync{font-size:.8rem;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin:1rem 0 1.2rem}
nav button{min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:.6rem .2rem;font:inherit;font-size:clamp(.78rem,3.3vw,1rem);font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.stat small{color:var(--muted);display:block;font-size:.85rem}

.stat.hero{grid-column:1/-1;border-color:var(--amber)}

.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:.55rem}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.item:hover{border-color:var(--amber)}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:.9rem}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:.12rem .6rem}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.tag.paid{background:var(--amber-soft);color:var(--amber)}
.tag.rev{background:var(--line);color:var(--plum)}
.btn{border:0;border-radius:12px;padding:.7rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;background:var(--plum);color:var(--surface)}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--bad-soft);color:var(--bad)}
.btn.gold{background:var(--amber);color:#fff}

.empty{color:var(--muted);text-align:center;padding:1.5rem 1rem;border:1.5px dashed var(--line);border-radius:14px}

input.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:.65rem .8rem;font:inherit;font-size:1.05rem}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--amber);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:.6rem;cursor:pointer}

.check{display:flex;align-items:center;gap:.6rem;font-weight:600;margin-top:.9rem;cursor:pointer}
.check input{width:1.2rem;height:1.2rem;accent-color:var(--amber)}
.hint{color:var(--muted);font-size:.85rem;margin-top:.25rem}
.calc{background:var(--surface);border:1.5px solid var(--amber);border-radius:6px 6px 22px 22px;padding:1rem;margin-top:1rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;font-size:.95rem}
.kv span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv .big{font-size:1.15rem;color:var(--plum)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tblw{overflow-x:auto}
.tbl th,.tbl td{padding:.45rem .4rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,25,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:env(safe-area-inset-top,0px) 0 0}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:1.1rem 1.1rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.modal h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;margin:0;color:var(--plum)}
.actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:var(--surface);padding:.6rem 1.1rem;border-radius:999px;font-weight:700;z-index:60}
.search{margin-bottom:.8rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.setup{max-width:560px;margin:2rem auto;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:1.2rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modalRoot"></div>

<script>
// ============ CONFIGURACIÓN ============
// Pega aquí el firebaseConfig de tu proyecto (el mismo de PrestJRC sirve).
// Si lo dejas en null, la app te pedirá pegarlo la primera vez.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD5QKSkEd0kyAR_oAnd4wMZvv8_G-mV8UQ",
  authDomain: "arbitraje-4a83e.firebaseapp.com",
  projectId: "arbitraje-4a83e",
  storageBucket: "arbitraje-4a83e.firebasestorage.app",
  messagingSenderId: "526474314223",
  appId: "1:526474314223:web:efa29a5d5ee2a4a4c7f61a"
};
const CATEGORIAS_BASE = ["Perfumes", "Ropa deportiva", "Gadgets", "Otros"];

const DEF = { pctCredito: 60, pctContado: 25, quincenas: 3 };
const COL_CLIENTES = "pf_clientes";
const COL_VENTAS = "pf_ventas";

// ============ UTILIDADES ============
const $ = s => document.querySelector(s);
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const fmt = n => "$" + (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
const fDate = s => s ? parse(s).toLocaleDateString("es-PA", { day: "numeric", month: "short", year: "numeric" }) : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(v); return isNaN(n) || n < 0 ? 0 : n; };

// Siguiente quincena (15 o último día del mes) después de una fecha
function nextQ(s) {
  const d = parse(s), y = d.getFullYear(), m = d.getMonth(), day = d.getDate(), ld = lastDay(y, m);
  if (day < 15) return iso(new Date(y, m, 15));
  if (day < ld) return iso(new Date(y, m, ld));
  return iso(new Date(y, m + 1, 15));
}
function schedule(first, n) { const out = [first]; while (out.length < n) out.push(nextQ(out[out.length - 1])); return out; }

// ============ CÁLCULO DE UNA VENTA ============
// Crédito: (costo − abono) × (1 + %) + abono. Contado: costo × (1 + %).
// Revendedor: se le vende al precio público menos su comisión.
function calcular({ costo, cantidad, modalidad, pct, abono, quincenas, revendedor, comision, primerPago }) {
  const costoT = r2(costo * cantidad);
  const contado = modalidad === "contado";
  const ab = contado ? 0 : Math.min(abono, costoT);
  const saldoBase = r2(costoT - ab);
  const publico = contado ? r2(costoT * (1 + pct / 100)) : r2(ab + saldoBase * (1 + pct / 100));
  const precio = revendedor ? r2(publico * (1 - comision / 100)) : publico;
  const financiado = contado ? precio : r2(precio - ab);
  const n = contado ? 1 : Math.max(1, Math.floor(quincenas) || 1);
  const fechas = schedule(primerPago, n);
  const base = Math.floor(financiado / n * 100) / 100;
  const cuotas = fechas.map((f, i) => ({ fecha: f, monto: i === n - 1 ? r2(financiado - base * (n - 1)) : base }));
  return { costoT, abono: ab, saldoBase, publico, precio, financiado, n, cuotas, ganancia: r2(precio - costoT), comisionMonto: r2(publico - precio) };
}

// Estado de una venta guardada
function estado(v) {
  const pagado = r2((v.pagos || []).reduce((a, p) => a + Number(p.monto), 0));
  const pendiente = r2(v.financiado - pagado);
  const hoy = today();
  let acum = 0, debido = 0, proxima = null;
  for (const c of v.cuotas) {
    acum = r2(acum + c.monto);
    if (c.fecha <= hoy) debido = acum;
    if (!proxima && acum > pagado + 0.009) proxima = { fecha: c.fecha, monto: r2(Math.min(c.monto, acum - pagado)) };
  }
  const atraso = r2(Math.max(0, debido - pagado));
  const cuotasAtrasadas = v.cuotas.filter((c, i) => c.fecha <= hoy && v.cuotas.slice(0, i + 1).reduce((a, x) => a + x.monto, 0) > pagado + 0.009).length;
  const st = pendiente <= 0.009 ? "Pagada" : atraso > 0.009 ? "Atrasada" : "Al día";
  const cobrado = r2(v.abono + pagado);
  const total = r2(v.abono + v.financiado);
  const gananciaCobrada = total > 0 ? r2(cobrado * (v.ganancia / total)) : 0;
  return { pagado, pendiente: Math.max(0, pendiente), atraso, cuotasAtrasadas, st, proxima, cobrado, total, gananciaCobrada };
}
const tagFor = st => `<span class="tag ${st === "Pagada" ? "paid" : st === "Atrasada" ? "late" : "ok"}">${st}</span>`;

const catDe = v => v.categoria || "Sin categoría";
function listaCategorias() { return [...new Set([...CATEGORIAS_BASE, ...ventas.map(v => v.categoria).filter(Boolean)])]; }

// ============ ESTADO Y FIREBASE ============
let db, clientes = [], ventas = [], view = "inicio", periodo = "todo", filtroVentas = "activas", filtroCat = "todas", buscar = "", listo = { c: false, v: false };

function getConfig() {
  if (FIREBASE_CONFIG) return FIREBASE_CONFIG;
  try { const s = localStorage.getItem("pf_fbconfig"); return s ? JSON.parse(s) : null; } catch { return null; }
}
function parseConfig(txt) {
  const cfg = {}; const re = /(\w+)\s*["']?\s*:\s*["']([^"']+)["']/g; let m;
  while ((m = re.exec(txt))) cfg[m[1]] = m[2];
  return cfg.apiKey && cfg.projectId ? cfg : null;
}

function showSetup(err) {
  $("#app").innerHTML = `<div class="setup">
    <h1>Arbitraje</h1>
    <p>Para guardar tus datos en la nube, pega el <b>firebaseConfig</b> de tu proyecto. Lo encuentras en Firebase, en Configuración del proyecto.</p>
    ${err ? `<p style="color:var(--bad);font-weight:700">${esc(err)}</p>` : ""}
    <textarea class="in" id="cfgTxt" rows="9" placeholder='apiKey: "...", authDomain: "...", projectId: "...", ...'></textarea>
    <div class="actions"><button class="btn" id="cfgSave">Conectar</button></div>
  </div>`;
  $("#cfgSave").onclick = () => {
    const cfg = parseConfig($("#cfgTxt").value);
    if (!cfg) return showSetup("No encontré apiKey y projectId en lo que pegaste. Revisa que esté completo.");
    try { localStorage.setItem("pf_fbconfig", JSON.stringify(cfg)); } catch {}
    start(cfg);
  };
}

function start(cfg) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e) { return showSetup("No se pudo conectar: " + e.message); }
  render();
  db.collection(COL_CLIENTES).onSnapshot(s => { clientes = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nombre.localeCompare(b.nombre)); listo.c = true; render(); }, errDb);
  db.collection(COL_VENTAS).onSnapshot(s => { ventas = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.fechaCompra.localeCompare(a.fechaCompra) || (b.creado || 0) - (a.creado || 0)); listo.v = true; render(); }, errDb);
}
function errDb(e) {
  toast("Error de base de datos: " + e.code);
  if (e.code === "permission-denied") $("#app").insertAdjacentHTML("afterbegin", `<p class="empty" style="color:var(--bad)">Firebase rechazó el acceso. Revisa las reglas de Firestore para permitir las colecciones <b>${COL_CLIENTES}</b> y <b>${COL_VENTAS}</b>.</p>`);
}
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }

// ============ RENDER PRINCIPAL ============
function render() {
  const tabs = [["inicio", "Inicio"], ["ventas", "Ventas"], ["clientes", "Clientes"], ["calc", "Calculadora"]];
  $("#app").innerHTML = `
    <header><h1>Arbitraje</h1><span class="sync">${listo.c && listo.v ? "Sincronizado" : "Cargando…"}</span></header>
    <nav>${tabs.map(([k, l]) => `<button data-tab="${k}" class="${view === k ? "on" : ""}">${l}</button>`).join("")}</nav>
    <div id="view"></div>`;
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.tab; render(); });
  ({ inicio: viewInicio, ventas: viewVentas, clientes: viewClientes, calc: viewCalc })[view]();
}

// ---------- INICIO / ESTADÍSTICAS ----------
function viewInicio() {
  const meses = [...new Set(ventas.map(v => v.fechaCompra.slice(0, 7)))].sort().reverse();
  const vs = periodo === "todo" ? ventas : ventas.filter(v => v.fechaCompra.startsWith(periodo));
  let invertido = 0, vendido = 0, cobrado = 0, porCobrar = 0, ganEsp = 0, ganCob = 0, atrasado = 0, comisiones = 0, unidades = 0;
  const atrasadas = [], proximos = [];
  const lim = iso(new Date(Date.now() + 16 * 864e5));
  vs.forEach(v => {
    const e = estado(v);
    invertido += v.costoT; vendido += e.total; cobrado += e.cobrado; porCobrar += e.pendiente;
    ganEsp += v.ganancia; ganCob += e.gananciaCobrada; atrasado += e.atraso; comisiones += v.comisionMonto || 0; unidades += Number(v.cantidad);
  });
  ventas.forEach(v => { const e = estado(v); if (e.st === "Atrasada") atrasadas.push([v, e]); else if (e.proxima && e.proxima.fecha <= lim) proximos.push([v, e]); });
  proximos.sort((a, b) => a[1].proxima.fecha.localeCompare(b[1].proxima.fecha));
  const porCat = {};
  vs.forEach(v => {
    const e = estado(v), k = catDe(v);
    const c = porCat[k] || (porCat[k] = { n: 0, inv: 0, gan: 0, cob: 0, pend: 0 });
    c.n++; c.inv += v.costoT; c.gan += v.ganancia; c.cob += e.gananciaCobrada; c.pend += e.pendiente;
  });
  const cats = Object.entries(porCat).sort((a, b) => b[1].gan - a[1].gan);
  const mesLabel = m => { const [y, mm] = m.split("-"); return new Date(y, mm - 1, 1).toLocaleDateString("es-PA", { month: "long", year: "numeric" }); };

  $("#view").innerHTML = `
    <div class="row between">
      <select class="in" id="per" style="max-width:260px">
        <option value="todo">Todo el tiempo</option>
        ${meses.map(m => `<option value="${m}" ${periodo === m ? "selected" : ""}>Compras de ${mesLabel(m)}</option>`).join("")}
      </select>
      <button class="btn gold" id="nv">Nueva venta</button>
    </div>
    <div class="stats" style="margin-top:.9rem">
      <div class="stat hero"><small>Ganancia cobrada de ${fmt(ganEsp)} esperada</small><b>${fmt(ganCob)}</b></div>
      <div class="stat"><small>Invertido</small><b>${fmt(invertido)}</b></div>
      <div class="stat"><small>Total vendido</small><b>${fmt(vendido)}</b></div>
      <div class="stat"><small>Cobrado</small><b>${fmt(cobrado)}</b></div>
      <div class="stat"><small>Por cobrar</small><b>${fmt(porCobrar)}</b></div>
      <div class="stat"><small>Atrasado</small><b style="color:${atrasado > 0 ? "var(--bad)" : "inherit"}">${fmt(atrasado)}</b></div>
      <div class="stat"><small>Ventas / unidades</small><b>${vs.length} / ${unidades}</b></div>
      <div class="stat"><small>Comisiones a revendedores</small><b>${fmt(comisiones)}</b></div>
      <div class="stat"><small>Retorno sobre lo invertido</small><b>${invertido > 0 ? (ganEsp / invertido * 100).toFixed(1) : 0}%</b></div>
    </div>
    ${cats.length ? `<h2>Por categoría</h2>
    <div class="tblw"><table class="tbl">
      <tr><th>Categoría</th><th class="n">Ventas</th><th class="n">Invertido</th><th class="n">Ganancia</th><th class="n">Cobrada</th><th class="n">Retorno</th></tr>
      ${cats.map(([k, c]) => `<tr><td>${esc(k)}</td><td class="n">${c.n}</td><td class="n">${fmt(c.inv)}</td><td class="n">${fmt(c.gan)}</td><td class="n">${fmt(c.cob)}</td><td class="n">${c.inv > 0 ? (c.gan / c.inv * 100).toFixed(0) : 0}%</td></tr>`).join("")}
    </table></div>` : ""}
    <h2>Atrasados</h2>
    ${atrasadas.length ? `<div class="list">${atrasadas.map(([v, e]) => ventaItem(v, e, `Debe ${fmt(e.atraso)} · ${e.cuotasAtrasadas} cuota${e.cuotasAtrasadas === 1 ? "" : "s"}`)).join("")}</div>` : `<p class="empty">Nadie está atrasado.</p>`}
    <h2>Cobros de los próximos 15 días</h2>
    ${proximos.length ? `<div class="list">${proximos.map(([v, e]) => ventaItem(v, e, `${fmt(e.proxima.monto)} el ${fDate(e.proxima.fecha)}`)).join("")}</div>` : `<p class="empty">No hay cobros en los próximos 15 días.</p>`}
  `;
  $("#per").onchange = e => { periodo = e.target.value; render(); };
  $("#nv").onclick = () => formVenta();
  bindVentaItems();
}

function ventaItem(v, e, extra) {
  return `<button class="item" data-venta="${v.id}">
    <div class="row between"><span class="t">${esc(v.clienteNombre)} ${v.revendedor ? '<span class="tag rev">Revendedor</span>' : ""}</span>${tagFor(e.st)}</div>
    <div class="row between"><span class="s">${esc(v.producto)}${v.marca ? " · " + esc(v.marca) : ""}${v.cantidad > 1 ? " ×" + v.cantidad : ""} · ${esc(catDe(v))} — ${fDate(v.fechaCompra)}</span><span class="amt">${extra ?? "Pendiente " + fmt(e.pendiente)}</span></div>
  </button>`;
}
function bindVentaItems() { document.querySelectorAll("[data-venta]").forEach(b => b.onclick = () => detalleVenta(b.dataset.venta)); }

// ---------- VENTAS ----------
function viewVentas() {
  const q = buscar.toLowerCase();
  let vs = ventas.map(v => [v, estado(v)]);
  if (filtroVentas === "activas") vs = vs.filter(([, e]) => e.st !== "Pagada");
  if (filtroVentas === "atrasadas") vs = vs.filter(([, e]) => e.st === "Atrasada");
  if (filtroVentas === "pagadas") vs = vs.filter(([, e]) => e.st === "Pagada");
  if (filtroCat !== "todas") vs = vs.filter(([v]) => catDe(v) === filtroCat);
  if (q) vs = vs.filter(([v]) => (v.clienteNombre + " " + v.producto + " " + (v.marca || "") + " " + catDe(v)).toLowerCase().includes(q));
  const catsUsadas = [...new Set(ventas.map(catDe))].sort();
  $("#view").innerHTML = `
    <div class="row between" style="margin-bottom:.8rem">
      <select class="in" id="fv" style="max-width:200px">
        ${[["activas", "Por cobrar"], ["atrasadas", "Atrasadas"], ["pagadas", "Pagadas"], ["todas", "Todas"]].map(([k, l]) => `<option value="${k}" ${filtroVentas === k ? "selected" : ""}>${l}</option>`).join("")}
      </select>
      <select class="in" id="fc" style="max-width:200px">
        <option value="todas">Todas las categorías</option>
        ${catsUsadas.map(k => `<option ${filtroCat === k ? "selected" : ""}>${esc(k)}</option>`).join("")}
      </select>
      <button class="btn gold" id="nv">Nueva venta</button>
    </div>
    <input class="in search" id="bq" placeholder="Buscar cliente, producto o categoría" value="${esc(buscar)}">
    ${vs.length ? `<div class="list">${vs.map(([v, e]) => ventaItem(v, e)).join("")}</div>` : `<p class="empty">${ventas.length ? "No hay ventas con este filtro." : "Registra tu primera venta con el botón Nueva venta."}</p>`}`;
  $("#fv").onchange = e => { filtroVentas = e.target.value; render(); };
  $("#fc").onchange = e => { filtroCat = e.target.value; render(); };
  $("#nv").onclick = () => formVenta();
  $("#bq").oninput = e => { buscar = e.target.value; const pos = e.target.selectionStart; viewVentas(); const i = $("#bq"); i.focus(); i.setSelectionRange(pos, pos); };
  bindVentaItems();
}

// ---------- CLIENTES ----------
function viewClientes() {
  $("#view").innerHTML = `
    <div class="row between" style="margin-bottom:.8rem"><span class="s" style="color:var(--muted)">${clientes.length} cliente${clientes.length === 1 ? "" : "s"}</span><button class="btn gold" id="nc">Nuevo cliente</button></div>
    ${clientes.length ? `<div class="list">${clientes.map(c => {
      const vs = ventas.filter(v => v.clienteId === c.id).map(estado);
      const pend = vs.reduce((a, e) => a + e.pendiente, 0), late = vs.some(e => e.st === "Atrasada");
      return `<button class="item" data-cli="${c.id}">
        <div class="row between"><span class="t">${esc(c.nombre)} ${c.revendedor ? `<span class="tag rev">Revendedor ${c.comision}%</span>` : ""}</span>${late ? tagFor("Atrasada") : ""}</div>
        <div class="row between"><span class="s">${esc(c.telefono || "Sin teléfono")} · ${vs.length} compra${vs.length === 1 ? "" : "s"}</span><span class="amt">${pend > 0 ? "Debe " + fmt(pend) : "Sin deuda"}</span></div>
      </button>`;
    }).join("")}</div>` : `<p class="empty">Aún no tienes clientes. Agrega el primero.</p>`}`;
  $("#nc").onclick = () => formCliente();
  document.querySelectorAll("[data-cli]").forEach(b => b.onclick = () => detalleCliente(b.dataset.cli));
}

// ---------- CALCULADORA ----------
function viewCalc() {
  $("#view").innerHTML = `
    <p style="color:var(--muted);margin-top:0">Calcula el precio sin registrar la venta.</p>
    ${camposCalculo("k")}
    <div id="kRes"></div>`;
  bindCalculo("k", false);
}

// Campos compartidos entre calculadora y formulario de venta
function camposCalculo(p, v = {}) {
  return `
    <label class="f">Forma de pago</label>
    <div class="seg" id="${p}Mod"><button data-m="credito" class="${(v.modalidad || "credito") === "credito" ? "on" : ""}">Crédito en quincenas</button><button data-m="contado" class="${v.modalidad === "contado" ? "on" : ""}">Contado</button></div>
    <div class="grid2">
      <div><label class="f" for="${p}Costo">Costo por unidad</label><input class="in" id="${p}Costo" type="number" inputmode="decimal" step="0.01" min="0" value="${v.costo ?? ""}" placeholder="0.00"></div>
      <div><label class="f" for="${p}Cant">Cantidad</label><input class="in" id="${p}Cant" type="number" inputmode="numeric" min="1" step="1" value="${v.cantidad ?? 1}"></div>
      <div><label class="f" for="${p}Pct">Ganancia %</label><input class="in" id="${p}Pct" type="number" inputmode="decimal" min="0" step="1" value="${v.pct ?? DEF.pctCredito}"></div>
      <div class="credOnly"><label class="f" for="${p}Ab">Abono inicial</label><input class="in" id="${p}Ab" type="number" inputmode="decimal" min="0" step="0.01" value="${v.abono ?? 0}"></div>
      <div class="credOnly"><label class="f" for="${p}N">Quincenas</label><input class="in" id="${p}N" type="number" inputmode="numeric" min="1" step="1" value="${v.quincenas ?? DEF.quincenas}"></div>
      <div class="credOnly"><label class="f" for="${p}Pri">Primer pago</label><input class="in" id="${p}Pri" type="date" value="${v.primerPago ?? nextQ(v.fechaCompra || today())}"></div>
    </div>
    <label class="check"><input type="checkbox" id="${p}Rev" ${v.revendedor ? "checked" : ""}> Es un revendedor</label>
    <div id="${p}ComBox" style="display:${v.revendedor ? "block" : "none"}"><label class="f" for="${p}Com">Comisión del revendedor %</label><input class="in" id="${p}Com" type="number" inputmode="decimal" min="0" max="99" step="1" value="${v.comision ?? 10}"><div class="hint">Se le vende al precio público menos su comisión. Él te paga a ti.</div></div>`;
}

function leerCalculo(p) {
  const modalidad = document.querySelector(`#${p}Mod .on`).dataset.m;
  return {
    modalidad, costo: num($(`#${p}Costo`).value), cantidad: Math.max(1, Math.floor(num($(`#${p}Cant`).value)) || 1),
    pct: num($(`#${p}Pct`).value), abono: num($(`#${p}Ab`).value), quincenas: Math.max(1, Math.floor(num($(`#${p}N`).value)) || 1),
    primerPago: $(`#${p}Pri`).value || nextQ(today()), revendedor: $(`#${p}Rev`).checked, comision: Math.min(99, num($(`#${p}Com`).value))
  };
}

function resumenHTML(i, r) {
  const cred = i.modalidad === "credito";
  return `<div class="calc"><div class="kv">
    <span>Costo total</span><span>${fmt(r.costoT)}</span>
    ${cred && r.abono > 0 ? `<span>Abono inicial</span><span>${fmt(r.abono)}</span><span>Saldo a financiar</span><span>${fmt(r.saldoBase)}</span>` : ""}
    <span>Precio al público</span><span>${fmt(r.publico)}</span>
    ${i.revendedor ? `<span>Comisión revendedor (${i.comision}%)</span><span>−${fmt(r.comisionMonto)}</span><span>Precio al revendedor</span><span>${fmt(r.precio)}</span>` : ""}
    <span>Tu ganancia</span><span style="color:var(--good)">${fmt(r.ganancia)}</span>
    ${cred ? `<span class="big">${r.n} pago${r.n === 1 ? "" : "s"} de</span><span class="big">${fmt(r.cuotas[0].monto)}${r.cuotas[r.n - 1].monto !== r.cuotas[0].monto ? "*" : ""}</span>` : `<span class="big">Cobras de contado</span><span class="big">${fmt(r.precio)}</span>`}
  </div>
  ${cred ? `<div class="tblw" style="margin-top:.7rem"><table class="tbl"><tr><th>#</th><th>Fecha</th><th class="n">Monto</th></tr>${r.cuotas.map((c, k) => `<tr><td>${k + 1}</td><td>${fDate(c.fecha)}</td><td class="n">${fmt(c.monto)}</td></tr>`).join("")}</table></div>` : ""}
  </div>`;
}

function bindCalculo(p, esForm) {
  const upd = () => {
    const i = leerCalculo(p);
    document.querySelectorAll(".credOnly").forEach(el => el.style.display = i.modalidad === "credito" ? "" : "none");
    $(`#${p}ComBox`).style.display = i.revendedor ? "block" : "none";
    const r = calcular({ ...i, primerPago: i.modalidad === "contado" ? ($("#vFecha")?.value || today()) : i.primerPago });
    $(`#${p}Res`).innerHTML = i.costo > 0 ? resumenHTML(i, r) : `<p class="empty" style="margin-top:1rem">Escribe el costo para ver el cálculo.</p>`;
  };
  document.querySelectorAll(`#${p}Mod button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${p}Mod button`).forEach(x => x.classList.toggle("on", x === b));
    $(`#${p}Pct`).value = b.dataset.m === "contado" ? DEF.pctContado : DEF.pctCredito;
    upd();
  });
  [`${p}Costo`, `${p}Cant`, `${p}Pct`, `${p}Ab`, `${p}N`, `${p}Pri`, `${p}Rev`, `${p}Com`].forEach(id => $("#" + id).addEventListener("input", upd));
  upd();
  return upd;
}

// ============ MODALES ============
function modal(html) {
  $("#modalRoot").innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#mbg").onclick = e => { if (e.target.id === "mbg") closeModal(); };
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

// ---------- FORM CLIENTE ----------
function formCliente(c = {}, alGuardar) {
  modal(`<h3>${c.id ? "Editar cliente" : "Nuevo cliente"}</h3>
    <label class="f" for="cNom">Nombre</label><input class="in" id="cNom" value="${esc(c.nombre)}">
    <div class="grid2">
      <div><label class="f" for="cTel">Teléfono</label><input class="in" id="cTel" inputmode="tel" value="${esc(c.telefono)}"></div>
      <div><label class="f" for="cCed">Cédula</label><input class="in" id="cCed" value="${esc(c.cedula)}"></div>
    </div>
    <label class="f" for="cNota">Nota</label><textarea class="in" id="cNota" rows="2">${esc(c.nota)}</textarea>
    <label class="check"><input type="checkbox" id="cRev" ${c.revendedor ? "checked" : ""}> Es revendedor</label>
    <div id="cComBox" style="display:${c.revendedor ? "block" : "none"}"><label class="f" for="cCom">Comisión %</label><input class="in" id="cCom" type="number" inputmode="decimal" min="0" max="99" value="${c.comision ?? 10}"></div>
    <div class="actions"><button class="btn alt" id="cx">Cancelar</button><button class="btn" id="cs">Guardar cliente</button></div>`);
  $("#cRev").onchange = e => $("#cComBox").style.display = e.target.checked ? "block" : "none";
  $("#cx").onclick = closeModal;
  $("#cs").onclick = async () => {
    const data = { nombre: $("#cNom").value.trim(), telefono: $("#cTel").value.trim(), cedula: $("#cCed").value.trim(), nota: $("#cNota").value.trim(), revendedor: $("#cRev").checked, comision: Math.min(99, num($("#cCom").value)) };
    if (!data.nombre) return toast("Escribe el nombre del cliente");
    try {
      let id = c.id;
      if (id) await db.collection(COL_CLIENTES).doc(id).update(data);
      else { data.creado = Date.now(); id = (await db.collection(COL_CLIENTES).add(data)).id; }
      toast("Cliente guardado");
      if (alGuardar) alGuardar({ id, ...data }); else closeModal();
    } catch (e) { toast("No se guardó: " + e.message); }
  };
}

// ---------- FORM VENTA ----------
function formVenta(pre = {}) {
  const opts = clientes.map(c => `<option value="${c.id}" ${pre.clienteId === c.id ? "selected" : ""}>${esc(c.nombre)}${c.revendedor ? " (revendedor)" : ""}</option>`).join("");
  modal(`<h3>Nueva venta</h3>
    <label class="f" for="vCli">Cliente</label>
    <div class="row" style="flex-wrap:nowrap"><select class="in" id="vCli"><option value="">Elige un cliente</option>${opts}</select><button class="btn alt sm" id="vNc" style="white-space:nowrap">+ Nuevo</button></div>
    <div class="grid2">
      <div><label class="f" for="vProd">Producto</label><input class="in" id="vProd" placeholder="Ej. Sauvage 100ml"></div>
      <div><label class="f" for="vMarca">Marca</label><input class="in" id="vMarca" placeholder="Ej. Dior"></div>
    </div>
    <label class="f" for="vCat">Categoría</label>
    <input class="in" id="vCat" list="catList" placeholder="Elige o escribe una nueva" value="${esc(pre.categoria || "")}">
    <datalist id="catList">${listaCategorias().map(k => `<option value="${esc(k)}">`).join("")}</datalist>
    <label class="f" for="vFecha">Fecha de compra</label><input class="in" id="vFecha" type="date" value="${today()}">
    ${camposCalculo("v", { fechaCompra: today() })}
    <div id="vRes"></div>
    <label class="f" for="vNota">Nota</label><input class="in" id="vNota">
    <div class="actions"><button class="btn alt" id="vx">Cancelar</button><button class="btn" id="vs">Guardar venta</button></div>`);
  const upd = bindCalculo("v", true);
  const aplicarCliente = () => {
    const c = clientes.find(x => x.id === $("#vCli").value);
    $("#vRev").checked = !!c?.revendedor;
    if (c?.revendedor) $("#vCom").value = c.comision;
    upd();
  };
  $("#vCli").onchange = aplicarCliente;
  if (pre.clienteId) aplicarCliente();
  $("#vFecha").onchange = () => { $("#vPri").value = nextQ($("#vFecha").value || today()); upd(); };
  $("#vNc").onclick = () => {
    const guard = { prod: $("#vProd").value, marca: $("#vMarca").value, cat: $("#vCat").value };
    formCliente({}, c => { clientes.push(c); formVenta({ clienteId: c.id, categoria: guard.cat }); $("#vProd").value = guard.prod; $("#vMarca").value = guard.marca; });
  };
  $("#vx").onclick = closeModal;
  $("#vs").onclick = async () => {
    const cli = clientes.find(x => x.id === $("#vCli").value);
    if (!cli) return toast("Elige un cliente");
    const prod = $("#vProd").value.trim();
    if (!prod) return toast("Escribe el producto");
    const categoria = $("#vCat").value.trim();
    if (!categoria) return toast("Elige una categoría");
    const i = leerCalculo("v");
    if (i.costo <= 0) return toast("Escribe el costo");
    const fechaCompra = $("#vFecha").value || today();
    const r = calcular({ ...i, primerPago: i.modalidad === "contado" ? fechaCompra : i.primerPago });
    const venta = {
      clienteId: cli.id, clienteNombre: cli.nombre, producto: prod, marca: $("#vMarca").value.trim(), categoria, fechaCompra, nota: $("#vNota").value.trim(),
      modalidad: i.modalidad, costo: i.costo, cantidad: i.cantidad, pct: i.pct, quincenas: r.n, revendedor: i.revendedor, comision: i.revendedor ? i.comision : 0,
      costoT: r.costoT, abono: r.abono, publico: r.publico, precio: r.precio, financiado: r.financiado, ganancia: r.ganancia, comisionMonto: i.revendedor ? r.comisionMonto : 0,
      cuotas: r.cuotas, pagos: i.modalidad === "contado" ? [{ id: uid(), fecha: fechaCompra, monto: r.precio, metodo: "Efectivo", nota: "Pago de contado" }] : [],
      creado: Date.now()
    };
    try { await db.collection(COL_VENTAS).add(venta); closeModal(); toast("Venta guardada"); }
    catch (e) { toast("No se guardó: " + e.message); }
  };
}

// ---------- DETALLE VENTA ----------
function detalleVenta(id) {
  const v = ventas.find(x => x.id === id); if (!v) return closeModal();
  const e = estado(v);
  const cli = clientes.find(c => c.id === v.clienteId);
  let acum = 0;
  const filas = v.cuotas.map((c, k) => {
    acum = r2(acum + c.monto);
    const st = acum <= e.pagado + 0.009 ? "Pagada" : c.fecha < today() ? "Atrasada" : "Pendiente";
    return `<tr><td>${k + 1}</td><td>${fDate(c.fecha)}</td><td class="n">${fmt(c.monto)}</td><td>${st === "Pendiente" ? '<span class="s" style="color:var(--muted)">Pendiente</span>' : tagFor(st)}</td></tr>`;
  }).join("");
  modal(`<div class="row between"><h3>${esc(v.producto)}</h3>${tagFor(e.st)}</div>
    <p style="margin:.2rem 0 0;color:var(--muted)">${esc(v.clienteNombre)} · ${esc(catDe(v))}${v.marca ? " · " + esc(v.marca) : ""}${v.cantidad > 1 ? " · " + v.cantidad + " unidades" : ""} · comprado el ${fDate(v.fechaCompra)}</p>
    <div class="calc"><div class="kv">
      <span>Costo</span><span>${fmt(v.costoT)}</span>
      <span>Forma de pago</span><span>${v.modalidad === "contado" ? "Contado" : v.quincenas + " quincenas"} · ${v.pct}%</span>
      ${v.abono > 0 ? `<span>Abono inicial</span><span>${fmt(v.abono)}</span>` : ""}
      ${v.revendedor ? `<span>Precio al público</span><span>${fmt(v.publico)}</span><span>Comisión (${v.comision}%)</span><span>−${fmt(v.comisionMonto)}</span>` : ""}
      <span>Total de la venta</span><span>${fmt(e.total)}</span>
      <span>Tu ganancia</span><span style="color:var(--good)">${fmt(v.ganancia)}</span>
      <span>Cobrado</span><span>${fmt(e.cobrado)}</span>
      <span class="big">Pendiente</span><span class="big">${fmt(e.pendiente)}</span>
      ${e.atraso > 0 ? `<span style="color:var(--bad)">Atrasado</span><span style="color:var(--bad)">${fmt(e.atraso)}</span>` : ""}
    </div></div>
    ${v.modalidad === "credito" ? `<h2 style="font-size:1.3rem">Quincenas</h2><div class="tblw"><table class="tbl"><tr><th>#</th><th>Fecha</th><th class="n">Monto</th><th>Estado</th></tr>${filas}</table></div>` : ""}
    <h2 style="font-size:1.3rem">Pagos recibidos</h2>
    ${(v.pagos || []).length ? `<div class="tblw"><table class="tbl"><tr><th>Fecha</th><th class="n">Monto</th><th>Método</th><th></th></tr>${v.pagos.map(p => `<tr><td>${fDate(p.fecha)}${p.nota ? `<div class="hint">${esc(p.nota)}</div>` : ""}</td><td class="n">${fmt(p.monto)}</td><td>${esc(p.metodo)}</td><td class="n"><button class="btn warn sm" data-delpago="${p.id}">Quitar</button></td></tr>`).join("")}</table></div>` : `<p class="empty">Todavía no hay pagos.</p>`}
    ${v.nota ? `<p class="hint">Nota: ${esc(v.nota)}</p>` : ""}
    <div class="actions">
      <button class="btn warn" id="dv">Borrar venta</button>
      ${cli?.telefono && e.pendiente > 0 ? `<button class="btn alt" id="wa">Recordar por WhatsApp</button>` : ""}
      ${e.pendiente > 0 ? `<button class="btn gold" id="rp">Registrar pago</button>` : ""}
      <button class="btn alt" id="cl">Cerrar</button>
    </div>`);
  $("#cl").onclick = closeModal;
  if ($("#rp")) $("#rp").onclick = () => formPago(v, e);
  if ($("#wa")) $("#wa").onclick = () => whatsapp(cli, [[v, e]]);
  $("#dv").onclick = async () => {
    if (!confirm(`¿Borrar la venta de ${v.producto} a ${v.clienteNombre}? También se borran sus pagos.`)) return;
    await db.collection(COL_VENTAS).doc(v.id).delete(); closeModal(); toast("Venta borrada");
  };
  document.querySelectorAll("[data-delpago]").forEach(b => b.onclick = async () => {
    if (!confirm("¿Quitar este pago?")) return;
    const pagos = v.pagos.filter(p => p.id !== b.dataset.delpago);
    await db.collection(COL_VENTAS).doc(v.id).update({ pagos });
    v.pagos = pagos; detalleVenta(v.id); toast("Pago quitado");
  });
}

// ---------- FORM PAGO ----------
function formPago(v, e) {
  const sug = e.atraso > 0 ? e.atraso : e.proxima ? e.proxima.monto : e.pendiente;
  modal(`<h3>Registrar pago</h3>
    <p style="margin:.2rem 0;color:var(--muted)">${esc(v.clienteNombre)} · ${esc(v.producto)} · pendiente ${fmt(e.pendiente)}</p>
    <div class="grid2">
      <div><label class="f" for="pMonto">Monto</label><input class="in" id="pMonto" type="number" inputmode="decimal" step="0.01" min="0" value="${r2(Math.min(sug, e.pendiente))}"></div>
      <div><label class="f" for="pFecha">Fecha</label><input class="in" id="pFecha" type="date" value="${today()}"></div>
    </div>
    <label class="f" for="pMet">Método</label>
    <select class="in" id="pMet"><option>Efectivo</option><option>Yappy</option><option>Transferencia</option></select>
    <label class="f" for="pNota">Nota</label><input class="in" id="pNota">
    <div class="row" style="margin-top:.7rem"><button class="btn alt sm" id="pTodo">Pagar todo (${fmt(e.pendiente)})</button></div>
    <div class="actions"><button class="btn alt" id="px">Cancelar</button><button class="btn" id="ps">Guardar pago</button></div>`);
  $("#pTodo").onclick = () => $("#pMonto").value = e.pendiente;
  $("#px").onclick = () => detalleVenta(v.id);
  $("#ps").onclick = async () => {
    const monto = r2(num($("#pMonto").value));
    if (monto <= 0) return toast("Escribe el monto");
    if (monto > e.pendiente + 0.009 && !confirm(`El pago es mayor que lo pendiente (${fmt(e.pendiente)}). ¿Guardarlo igual?`)) return;
    const pagos = [...(v.pagos || []), { id: uid(), fecha: $("#pFecha").value || today(), monto, metodo: $("#pMet").value, nota: $("#pNota").value.trim() }];
    try { await db.collection(COL_VENTAS).doc(v.id).update({ pagos }); v.pagos = pagos; toast("Pago guardado"); detalleVenta(v.id); }
    catch (err) { toast("No se guardó: " + err.message); }
  };
}

// ---------- DETALLE CLIENTE ----------
function detalleCliente(id) {
  const c = clientes.find(x => x.id === id); if (!c) return closeModal();
  const vs = ventas.filter(v => v.clienteId === id).map(v => [v, estado(v)]);
  const tot = vs.reduce((a, [v, e]) => ({ comp: a.comp + e.total, cob: a.cob + e.cobrado, pend: a.pend + e.pendiente, gan: a.gan + v.ganancia }), { comp: 0, cob: 0, pend: 0, gan: 0 });
  modal(`<div class="row between"><h3>${esc(c.nombre)}</h3>${c.revendedor ? `<span class="tag rev">Revendedor ${c.comision}%</span>` : ""}</div>
    <p style="margin:.2rem 0;color:var(--muted)">${esc(c.telefono || "Sin teléfono")}${c.cedula ? " · Cédula " + esc(c.cedula) : ""}</p>
    ${c.nota ? `<p class="hint">${esc(c.nota)}</p>` : ""}
    <div class="stats" style="margin-top:.8rem">
      <div class="stat"><small>Total comprado</small><b>${fmt(tot.comp)}</b></div>
      <div class="stat"><small>Ha pagado</small><b>${fmt(tot.cob)}</b></div>
      <div class="stat"><small>Debe</small><b>${fmt(tot.pend)}</b></div>
      <div class="stat"><small>Tu ganancia con él</small><b>${fmt(tot.gan)}</b></div>
    </div>
    <h2 style="font-size:1.3rem">Compras</h2>
    ${vs.length ? `<div class="list">${vs.map(([v, e]) => ventaItem(v, e)).join("")}</div>` : `<p class="empty">Sin compras todavía.</p>`}
    <div class="actions">
      ${vs.length ? "" : `<button class="btn warn" id="dc">Borrar cliente</button>`}
      <button class="btn alt" id="ec">Editar</button>
      ${c.telefono && tot.pend > 0 ? `<button class="btn alt" id="wa">Estado de cuenta por WhatsApp</button>` : ""}
      <button class="btn gold" id="nvc">Nueva venta</button>
      <button class="btn alt" id="cl">Cerrar</button>
    </div>`);
  bindVentaItems();
  $("#cl").onclick = closeModal;
  $("#ec").onclick = () => formCliente(c);
  $("#nvc").onclick = () => formVenta({ clienteId: c.id });
  if ($("#wa")) $("#wa").onclick = () => whatsapp(c, vs.filter(([, e]) => e.pendiente > 0));
  if ($("#dc")) $("#dc").onclick = async () => { if (!confirm(`¿Borrar a ${c.nombre}?`)) return; await db.collection(COL_CLIENTES).doc(c.id).delete(); closeModal(); toast("Cliente borrado"); };
}

function whatsapp(c, lista) {
  let tel = (c.telefono || "").replace(/\D/g, "");
  if (tel.length === 8) tel = "507" + tel;
  const lineas = lista.map(([v, e]) => `• ${v.producto}: pagado ${fmt(e.cobrado)}, pendiente ${fmt(e.pendiente)}` + (e.atraso > 0 ? ` (atrasado ${fmt(e.atraso)})` : e.proxima ? `. Próxima cuota ${fmt(e.proxima.monto)} el ${fDate(e.proxima.fecha)}` : ""));
  const total = lista.reduce((a, [, e]) => a + e.pendiente, 0);
  const msg = `Hola ${c.nombre.split(" ")[0]}, te comparto tu estado de cuenta:\n\n${lineas.join("\n")}\n\nTotal pendiente: ${fmt(total)}\n\n¡Gracias!`;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, "_blank");
}

// ============ ARRANQUE ============
const cfg = getConfig();
if (cfg) start(cfg); else showSetup();
</script>
</body>
</html>
